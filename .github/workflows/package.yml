# Build, lint and test this package on trixie (handbook decision 0041,
# first implementation, step 5). The checks are "package / build" and
# "package / autopkgtest".
#
# build: libcoraza and coreruleset are not in Debian, so their keel/trixie
# branches are built first (libcoraza with golang-1.26-go from
# trixie-backports, tests skipped; their own CI runs them) and
# libcoraza-dev is installed. This package is then built with gbp
# buildpackage in a debian:trixie container with trixie-backports enabled,
# source and binary, the orig tarball rebuilt from the pristine-tar branch,
# and lintian checks the .changes: any error or warning fails the job, as
# packages/build of Keel-Linux/common does. Nothing is signed or
# published; the files are kept as the artifacts "debs" and "keel-deps".
#
# autopkgtest: debian/tests/crs-blocks restarts nginx with systemctl, so it
# runs in a debian:trixie container booted with systemd under podman on
# the runner, with autopkgtest's null runner inside it, as on a Keel
# machine (README.md). The container is the isolation that
# isolation-container asks for.
#
# Keel-Linux/.github's reusable build-deb.yml does not fit: it runs on the
# self-hosted keel-lxc runner, not registered yet, and neither uses gbp nor
# lints. This workflow follows Keel-Linux/common's packages.yml instead.
name: package

on:
  pull_request:
  push:
    branches: [keel/trixie]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 45
    steps:
      - name: Enable trixie-backports and install the tools
        run: |
          echo 'deb http://deb.debian.org/debian trixie-backports main' \
            > /etc/apt/sources.list.d/trixie-backports.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git git-buildpackage pristine-tar \
            devscripts equivs lintian
          git config --global --add safe.directory '*'
      - name: Build libcoraza and coreruleset from their keel/trixie
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deps-area" keel-deps
          for repo in libcoraza coreruleset; do
            src="$RUNNER_TEMP/src/$repo"
            git clone -q --branch keel/trixie \
              "https://github.com/Keel-Linux/$repo.git" "$src"
            for branch in upstream/latest pristine-tar; do
              git -C "$src" branch -q "$branch" "origin/$branch"
            done
            (cd "$src" && gbp setup-gitattributes)
            (cd "$RUNNER_TEMP" && mk-build-deps --install --remove \
              --tool 'apt-get -y -qq --no-install-recommends' \
              "$src/debian/control")
            (cd "$src" && gbp buildpackage \
              --git-export-dir="$RUNNER_TEMP/deps-area" \
              --git-builder='dpkg-buildpackage -us -uc -b')
          done
          cp "$RUNNER_TEMP"/deps-area/*.deb keel-deps/
          rm -f keel-deps/*-dbgsym_*.deb
          ls -l keel-deps
          apt-get install -y -qq --no-install-recommends \
            ./keel-deps/libcoraza1_*.deb ./keel-deps/libcoraza-dev_*.deb
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: src
      - name: Track the upstream and pristine-tar branches
        working-directory: src
        run: |
          # As gbp clone does: upstream's .gitattributes must not change
          # what is exported, or the tree no longer matches the orig tarball.
          gbp setup-gitattributes
          for branch in upstream/latest pristine-tar; do
            git branch -f "$branch" "origin/$branch"
          done
      - name: Install the build dependencies
        run: |
          cd "$RUNNER_TEMP"
          mk-build-deps --install --remove \
            --tool 'apt-get -y -qq --no-install-recommends' \
            "$GITHUB_WORKSPACE/src/debian/control"
      - name: Build
        working-directory: src
        run: |
          gbp buildpackage --git-ignore-branch \
            --git-export-dir="$RUNNER_TEMP/build-area" \
            --git-builder='dpkg-buildpackage -us -uc'
          mkdir ../dist
          cp "$RUNNER_TEMP"/build-area/*.deb "$RUNNER_TEMP"/build-area/*.dsc \
            "$RUNNER_TEMP"/build-area/*.tar.* "$RUNNER_TEMP"/build-area/*.buildinfo \
            "$RUNNER_TEMP"/build-area/*.changes ../dist/
      - name: Lint
        run: |
          lintian --fail-on error,warning --info --display-info \
            dist/*.changes
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: keel-deps
          path: keel-deps/
          if-no-files-found: error

  autopkgtest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: keel-deps
          path: dist
      - name: Boot a trixie container with systemd
        run: |
          cat > Containerfile <<'EOF'
          FROM docker.io/library/debian:trixie
          RUN apt-get update -qq \
           && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              --no-install-recommends autopkgtest dpkg-dev systemd \
              systemd-sysv dbus ca-certificates \
           && apt-get clean
          CMD ["/sbin/init"]
          EOF
          sudo podman build -q -t testbed -f Containerfile .
          sudo podman run -d --name testbed --systemd=always --privileged \
            -v "$PWD/dist:/dist:ro" testbed
          # The system bus is not up the instant the container starts.
          for _ in $(seq 60); do
            state=$(sudo podman exec testbed systemctl is-system-running --wait 2>/dev/null || true)
            case "$state" in running|degraded) break ;; esac
            sleep 1
          done
          echo "systemd: $state"
          case "$state" in running|degraded) ;; *) exit 1 ;; esac
      - name: Run debian/tests
        run: |
          sudo podman exec testbed sh -c \
            'autopkgtest --ignore-restrictions=isolation-container /dist/*.dsc /dist/*.deb -- null'
